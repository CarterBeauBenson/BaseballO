baseball_modeling_patterns:
  version: "1.2"
  status: "canonical"

  person_roles:
    rule: >
      Player and manager roles are Occupation Roles scoped to a Person and a
      Baseball Team. Batter, pitcher, baserunner, fielder, and catcher roles
      are persistent capacities of a player. Umpire and official scorer roles
      are persistent adjudicator roles. Games and acts realize these roles
      when supported.

    identity_pattern:
      player_occupation_template: "{data}player/{playerId}/team/{teamId}/role/player"
      manager_occupation_template: "{data}person/{personId}/team/{teamId}/role/manager"
      player_capacity_template: "{data}player/{playerId}/role/{roleType}"
      official_template: "{data}person/{personId}/role/{roleType}"

    examples:
      - "https://baseballontology.org/data/player/621381/role/pitcher"
      - "https://baseballontology.org/data/player/430945/role/batter"
      - "https://baseballontology.org/data/player/430945/team/110/role/player"
      - "https://baseballontology.org/data/person/542750/role/official-scorer"

    prohibited:
      - typing a Person as BatterRole, PitcherRole, or another role
      - minting a new person-role IRI merely because the bearer appears in another game for the same team
      - creating a new PitcherRole for every pitch
      - treating a role as realized continuously throughout its existence

    realization_rule: >
      A game realizes the team-scoped PlayerRole of each accepted player and
      the persistent roles of its officials. Relevant acts additionally
      realize specialized player roles.
      A bench player has a PlayerRole realized by the game without implying a
      BatterRole, PitcherRole, FielderRole, CatcherRole, or BaserunnerRole act.

  contextual_team_roles:
    rule: >
      HomeTeamRole and AwayTeamRole remain game-scoped because home and away
      status changes from game to game.

  role_stases:
    rule: >
      Every mapped persistent person role participates in a CCO Stasis of Role
      that also has the bearer and role as participants and occupies an open
      Temporal Interval.
    identity_pattern:
      stasis: "{roleIri}/stasis"
      temporal_interval: "{roleIri}/stasis/temporal-interval"
    boundary_rule: >
      Do not create a Process Beginning, Process Ending, temporal boundary, or
      boundary identifier until an authoritative source supplies the relevant
      date or time evidence. When such a source is selected, preserve the
      owner's requirement that date-level identifiers designate day-sized
      intervals; resolve the exact CCO boundary pattern at that time.

  player_process_relations:
    participation_rule: >
      Use BFO has participant from an Act or Process to each participating
      Person or Artifact. Use realizes separately from an Act to the
      contextual Role it realizes.

    examples:
      Pitch Act:
        participant: pitcher
        realizes: Pitcher Role

      Swing Act:
        participant: batter
        realizes: Batter Role

      Baserunning Act:
        participant: runner
        realizes: Baserunner Role

      Fielding Act:
        participant: fielder
        realizes: Fielder Role

      Baseball Game:
        relation_to_player: participates in

      Plate Appearance:
        relation_to_player: participates in

  institutional_event_classification:
    rule: >
      MLB event classifications already reflect institutional judgments.
      A source home_run value licenses creation of a Home Run Process, and a
      source strike call licenses creation of the relevant Strike Process.

    interpretation: >
      The ordinary baseball event classes represent institutionally recognized
      events. They do not represent judgment-independent proof that the actual
      physical process satisfied the baseball rule.

    examples:
      source_home_run:
        create: Home Run Process

      source_double:
        create: Double Process

      source_strike:
        create: Strike Process

      source_out:
        create: Out Process

    record_pattern:
      rule: >
        A Baseball Event Record is an ICE about every supported distinct act,
        physical process, judgment act, decision ICE, call act, counted
        process, temporal entity, site, role, or artifact described by the
        source record.

    adjudication_pattern:
      rule: >
        Every mapped counted institutional process has an authorized Baseball
        Adjudication Act as an occurrent part. The judgment has output a
        distinct Baseball Decision ICE, and the decision ICE is about the
        counted process. A Call Act is separate and is generated only for the
        source-supported communication patterns.

    actual_processes:
      rule: >
        A later model may distinguish an institutionally recognized event from
        a judgment-independent process that actually satisfies the relevant
        rule.

  statistical_counts:
    rule: >
      Do not materialize derived statistical totals during ingestion.

    examples_not_to_store:
      - player hit count
      - player home run count
      - player strikeout count
      - player empty game count

    query_rule: >
      Calculate statistical totals using SPARQL over the relevant event or act
      individuals.

    examples:
      hits: "COUNT instances of Hit Process associated with the player"
      home_runs: "COUNT instances of Home Run Process associated with the player"
      empty_games: >
        Count games satisfying the selected absence-based contribution query.

    clarification: >
      The word counted should not be used to name a second event individual.
      A source-recognized home run is represented as a Home Run Process. The
      numerical total of home runs is calculated by SPARQL.

  occurrent_parthood:
    rule: >
      Larger baseball processes have smaller processes and acts as occurrent
      parts.

    hierarchy:
      Baseball Game:
        has_occurrent_part:
          - Inning
          - Plate Appearance

      Plate Appearance:
        has_occurrent_part:
          - Pitch Act
          - Swing Act
          - Bat-Ball Contact Process
          - Baserunning Act
          - Fielding Act
          - recognized result processes

  temporal_regions:
    rule: >
      Every represented process occupies a temporal region.

    game_region:
      begins_at: first pitch
      ends_at: final out
      note: >
        This treats "first out" in the project owner's statement as meaning
        "final out," because the game continues after its first out.

    nested_regions:
      rule: >
        Temporal regions corresponding to occurrent parts are temporal parts
        of the temporal region occupied by the containing process.

      examples:
        - Game Temporal Region contains Plate Appearance Temporal Regions
        - Plate Appearance Temporal Region contains Pitch Temporal Regions
        - Plate Appearance Temporal Region contains Swing Temporal Regions

    source_times:
      rule: >
        Use source start and end timestamps to establish temporal regions when
        those values are available.

    no_false_precision:
      rule: >
        Do not assign a smaller process the entire temporal region of its
        parent unless the source supports that equivalence.

  time_measurements:
    rule: >
      Timestamp values are carried by time measurement information content
      entities that designate temporal regions or their boundaries.

    distinctions:
      process: "occupies a temporal region"
      temporal_region: "is the temporal extent occupied by the process"
      time_measurement_ice: "designates the temporal region or boundary"
      timestamp_literal: "is the value carried by the measurement ICE"

  sites:
    rule: >
      Acts occur at sites.

    priority:
      - source coordinates
      - source named location
      - Baseball Field fallback

    coordinate_site:
      rule: >
        When source coordinates are provided, create or identify the site
        designated by those coordinates and assert that the act occurs there.

    named_site:
      rule: >
        When the source gives a location such as left field, right field,
        center field, a base, the mound, or the batter's box, use that site.

    fallback_site:
      rule: >
        When the source provides no more specific location information, assert
        that the act occurs at the Baseball Field site.

    player_location:
      rule: >
        A player's presence at a site is established through participation or
        agency in an act that occurs at that site during the temporal region
        occupied by the act.

  process_ordering:
    default_relation: precedes

    rule: >
      Use temporal precedence between sequential baseball processes unless
      there is an explicit reason to assert a stronger relation.

    examples:
      - Pitch Act precedes Swing Act
      - Swing Act precedes Bat-Ball Contact Process
      - Bat-Ball Contact Process precedes Fielding Act
      - Fielding Act precedes Throw Act
      - Throw Act precedes Out Process

    prohibited:
      - inferring causation solely from JSON array order
      - inferring causation solely from temporal precedence

  source_absence:
    rule: >
      Failure to find an event in the MLB source does not establish that the
      corresponding real-world process did not occur.

    creation_rule: >
      Create individuals only when the source directly supports them or when
      an approved deterministic mapping rule licenses their creation.

    prohibited:
      - creating processes merely because they are typical
      - treating missing source data as proof of nonexistence
      - reconstructing unsupported physical or judgmental detail

    derived_absence:
      rule: >
        Absence-based statistics may be computed by SPARQL against an explicit
        completeness profile for the supported MLB event mappings.
