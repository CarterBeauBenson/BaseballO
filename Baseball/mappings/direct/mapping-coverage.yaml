title: Direct MLB feed to BaseballO RML coverage
source_file_name_expected: game.json
source_mutation: none
intermediary_normalization: none
mapping_version: 0.2.0
completed_game_precondition: true

implemented:
  context:
    status: mapped
    includes:
    - BaseballGame, Inning, HalfInning, and PlateAppearance containment
    - distinct BaseballVenue and BaseballFieldSite
    - BaseballTeam participation and game-scoped home/away roles
    - Persons and game-scoped batter, pitcher, baserunner, fielder, umpire, and scorer roles
    - game, plate-appearance, and pitch temporal regions and timestamp ICEs

  pitch_physical_chain:
    status: mapped-with-processor-join-limitation
    source: playEvents where isPitch is true
    chain:
    - PitchAct
    - PitchBallMotionProcess
    participants:
    - pitcher Person
    - game-scoped PitcherRole
    - pitch-scoped Baseball
    processor_limitation: >-
      RMLMapper 8.1.0 does not expand the parent-side playEvents[*].playId
      reference across every nested pitch in this mapping. The checked-in
      fixture therefore links pitcher, role, and plate appearance only for
      terminal matching pitch events, not all 282 PitchAct individuals.

  bat_use_and_contact:
    status: mapped-with-processor-join-limitation
    source:
    - pitch call codes S, F, T, X, D, and E
    - enclosing result.eventType sac_bunt
    chain:
    - SwingAct or BuntAct
    - BatBallContactProcess when contact is supported
    - BattedBallMotionProcess when contact is supported
    - BattedBallPlayProcess
    note: sac_bunt terminal events use BuntAct and are excluded from the generic in-play SwingAct sources
    processor_limitation: >-
      Batter, BatterAct, role, and plate-appearance joins use the same nested
      playEvents[*].playId parent reference and do not currently cover every
      swing, bunt, contact, or batted-ball motion in processor output.

  pitch_classifications:
    status: mapped
    includes:
    - BallProcess with BallJudgmentAct, BallDecisionICE, and BallCallAct
    - StrikeProcess with StrikeJudgmentAct and StrikeDecisionICE
    - StrikeCallAct for called-strike code C
    - FoulBallProcess with FoulBallJudgmentAct, FoulDecisionICE, and FoulCallAct
    - FoulTipProcess sharing one individual with StrikeProcess
    - FairBallProcess with FairBallJudgmentAct, FairDecisionICE, and FairCallAct

  plate_appearance_results:
    status: mapped
    pattern: one result individual plus one constitutive adjudication act and decision ICE
    specific_types:
    - HomeRunProcess
    - TripleProcess
    - DoubleProcess
    - SingleProcess
    - WalkProcess
    - HitByPitchProcess
    - FieldersChoiceProcess
    - ErrorProcess
    - BattedBallOutProcess
    - ForceOutProcess
    - StrikeoutProcess
    - GroundedIntoDoublePlayProcess
    - DoublePlayProcess
    - SacrificeFlyProcess
    - SacrificeBuntProcess
    - BalkProcess
    - InterferenceProcess
    scorer_overlays:
    - HitJudgmentAct and HitDecisionICE
    - ErrorJudgmentAct and ErrorDecisionICE
    - FieldersChoiceJudgmentAct and FieldersChoiceDecisionICE
    - SacrificeJudgmentAct and SacrificeDecisionICE

  runner_patterns:
    status: mapped-with-source-identity-limitation
    includes:
    - outcome-neutral BaserunningAct paths
    - BaseTouchingProcess for safe reach, advance, and run scoring
    - OutProcess, SafeProcess, and RunProcess adjudication and decision ICEs
    - explicit StealAttemptAct and separate StolenBaseProcess for stolen_base event types
    note: runner acts remain game parts because the nested runner object lacks safe plate-appearance identity

  records:
    status: mapped
    note: BaseballEventRecord individuals are about every supported act, process, judgment, decision, call, artifact, timestamp, coordinate ICE, and site described by their source record

  coordinates:
    status: partial
    includes:
    - BaseballFieldCoordinateReferenceSystemICE
    - BaseballFieldCoordinateICE
    - BattedBallLocationSite
    - BattedBallMotionProcess occurs at the designated site
    deferred:
    - coordX and coordY literals

deferred:
  last_play_iterator_execution:
    reason: >-
      RMLMapper 8.1.0 expands the LastPlaySource [-1:] slice to all plays for
      the checked-in fixture, placing every plate-appearance end value on the
      game end timestamp. Queries currently use MAX as the terminal-time
      convention; the mapping execution must be corrected.
  nested_pitch_parent_joins:
    reason: >-
      Parent references through playEvents[*].playId cover only terminal
      matching events in the checked-in fixture. Do not publish pitcher,
      swing, or contact totals until all nested events receive their intended
      play, person, and role links.
  fielding_acts:
    reason: fielding credits lack stable ancestor-aware identity
  pickoff_acts:
    reason: runner records do not identify the pitcher agent for the pickoff act
  ambiguous_second_counted_foul:
    reason: event-local count.strikes equals 2 cannot distinguish an increment from an unchanged two-strike count
  action_events:
    reason: non-pitch advisory records mix unsupported classes and unstable identifiers
  measurements:
    reason: approved measurement ICE classes and datatype properties are incomplete
  runner_plate_appearance_link:
    reason: runner records expose neither atBatIndex nor a runner array index to the selected processor
