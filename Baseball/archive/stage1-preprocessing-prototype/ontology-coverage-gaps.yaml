baseball_ontology_coverage_gaps:
  version: "1.0"
  status: "active during Stage 1 mapping"
  policy: >
    Do not mint new ontology classes or silently substitute an approximate
    baseball class. Use an available BFO or CCO class only when it is genuinely
    applicable, and record missing baseball-specific coverage here.

  gaps:
    - id: baseball-team
      source_fields:
        - gameData.teams.home
        - gameData.teams.away
      missing_coverage:
        - Baseball Team class
        - Home Team Role
        - Away Team Role
      stage_1_handling: >
        Type teams as CCO Organization and make them participants in the game.
        Do not yet assert the home/away distinction in RDF.

    - id: venue-and-field
      source_fields:
        - gameData.venue.id
        - gameData.venue.name
      missing_coverage:
        - Baseball Venue or Stadium class
        - explicit relation between a venue facility and its Baseball Field Site
      stage_1_handling: >
        Mint a stable field Site IRI under the MLB venue identifier and type it
        as Baseball Field Site. Do not assert that the MLB venue record and the
        field Site are identical.

    - id: domain-temporal-regions
      source_fields:
        - gameData.gameInfo.firstPitch
        - liveData.plays.allPlays[*].about.startTime
        - liveData.plays.allPlays[*].about.endTime
        - liveData.plays.allPlays[*].playEvents[*].startTime
        - liveData.plays.allPlays[*].playEvents[*].endTime
      missing_coverage:
        - Baseball Game Temporal Region
        - Inning Temporal Region
        - Half Inning Temporal Region
        - Plate Appearance Temporal Region
        - Pitch Temporal Region
      stage_1_handling: >
        Use BFO Temporal Interval directly for all interval individuals and BFO
        Temporal Instant for their boundaries.

    - id: baseball-time-measurement
      source_fields:
        - all mapped timestamp values
      missing_coverage:
        - Baseball Time Measurement ICE
      stage_1_handling: >
        Use the CCO Measurement Information Content Entity directly, with
        has datetime value and designates relations.

    - id: coordinate-defined-sites
      source_fields:
        - playEvents[*].pitchData.coordinates
        - playEvents[*].hitData.coordinates
        - playEvents[*].hitData.location
      missing_coverage:
        - coordinate-defined baseball Site pattern
        - explicit coordinate reference system for MLB field-chart coordinates
        - relation between a field-chart coordinate Site and named field regions
      stage_1_handling: >
        Preserve coordinate values in the enriched source but do not map them
        yet. Use Baseball Field Site as the safe fallback. This must be resolved
        before claiming coordinate-specific act locations.

    - id: double-play-result
      source_event_types:
        - double_play
        - grounded_into_double_play
      missing_coverage:
        - Double Play Process
        - Grounded Into Double Play Process
      stage_1_handling: >
        Create only the generic Baseball Institutional Process identified by the
        source eventType. Do not assign a more specific baseball class.

    - id: foul-tip
      source_pitch_call_codes:
        - T
      missing_coverage:
        - Foul Tip Process
      stage_1_handling: >
        Create the supported Strike Process and Bat-Ball Contact Process. Do not
        type the event as Foul Ball Process.

    - id: named-adjudication-events
      source_fields:
        - result.eventType
        - playEvents[*].details.call
      missing_coverage: []
      source_granularity_issue: >
        The source supplies institutionally recognized classifications but does
        not provide a unique identifier for every judgment act or the responsible
        adjudicator for every call.
      stage_1_handling: >
        Create the recognized process and its Baseball Event Record. Do not mint
        a named judgment act unless a later mapping rule is explicitly approved.
        Existing TBox existential restrictions continue to entail that the
        relevant judgment act exists.

    - id: walk-off-game-ending
      source_fields:
        - liveData.plays.allPlays[*].runners[*].movement.outNumber
        - liveData.plays.allPlays[*].about.endTime
      missing_coverage: []
      modeling_issue: >
        A game may end without a final out, as in a walk-off win. The current
        canonical rule says the game temporal region ends at the final out.
      stage_1_handling: >
        Prefer the latest third-out play. If none exists, the enrichment script
        transparently falls back to the final completed play end time and records
        gameEndFallbackUsed as true. This edge case requires a later modeling decision.
