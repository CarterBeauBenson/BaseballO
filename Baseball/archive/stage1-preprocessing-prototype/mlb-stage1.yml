prefixes:
  base: https://baseballontology.org/
  data: https://baseballontology.org/data/
  obo: http://purl.obolibrary.org/obo/
  cco: https://www.commoncoreontologies.org/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd: http://www.w3.org/2001/XMLSchema#

mappings:

  # --------------------------------------------------------------------------
  # Game, field site, source identifier, and temporal extent
  # --------------------------------------------------------------------------

  game:
    sources:
      - [current-game.json~jsonpath, "$.game"]
    s: data:game/$(gamePk)
    po:
      - [a, base:BaseballGame]
      - [cco:ont00001918, data:venue/$(venueId)/baseball-field~iri]
      - [obo:BFO_0000199, data:game/$(gamePk)/temporal-region~iri]

  game_identifier:
    sources:
      - [current-game.json~jsonpath, "$.game"]
    s: data:game/$(gamePk)/identifier/mlb-game-pk
    po:
      - [a, cco:ont00000649]
      - [cco:ont00001916, data:game/$(gamePk)~iri]
      - [cco:ont00001765, $(gamePk), xsd:string]

  game_field_site:
    sources:
      - [current-game.json~jsonpath, "$.game"]
    s: data:venue/$(venueId)/baseball-field
    po:
      - [a, base:BaseballFieldSite]

  game_temporal_region:
    sources:
      - [current-game.json~jsonpath, "$.game"]
    s: data:game/$(gamePk)/temporal-region
    po:
      - [a, obo:BFO_0000202]
      - [obo:BFO_0000222, data:game/$(gamePk)/temporal-instant/start~iri]
      - [obo:BFO_0000224, data:game/$(gamePk)/temporal-instant/end~iri]

  game_start_instant:
    sources:
      - [current-game.json~jsonpath, "$.game"]
    s: data:game/$(gamePk)/temporal-instant/start
    po:
      - [a, obo:BFO_0000203]

  game_end_instant:
    sources:
      - [current-game.json~jsonpath, "$.game"]
    s: data:game/$(gamePk)/temporal-instant/end
    po:
      - [a, obo:BFO_0000203]

  game_start_time_measurement:
    sources:
      - [current-game.json~jsonpath, "$.game"]
    s: data:game/$(gamePk)/time-measurement/start
    po:
      - [a, cco:ont00001163]
      - [cco:ont00001916, data:game/$(gamePk)/temporal-instant/start~iri]
      - [cco:ont00001767, $(firstPitchTime), xsd:dateTime]

  game_end_time_measurement:
    sources:
      - [current-game.json~jsonpath, "$.game"]
    s: data:game/$(gamePk)/time-measurement/end
    po:
      - [a, cco:ont00001163]
      - [cco:ont00001916, data:game/$(gamePk)/temporal-instant/end~iri]
      - [cco:ont00001767, $(finalOutTime), xsd:dateTime]

  # --------------------------------------------------------------------------
  # Teams. BaseballO currently lacks Baseball Team and home/away team roles.
  # Teams are therefore typed only as CCO Organizations in this mapping.
  # --------------------------------------------------------------------------

  teams:
    sources:
      - [current-game.json~jsonpath, "$.teams[*]"]
    s: data:team/$(teamId)
    po:
      - [a, cco:ont00001180]

  team_identifiers:
    sources:
      - [current-game.json~jsonpath, "$.teams[*]"]
    s: data:team/$(teamId)/identifier/mlb-team-id
    po:
      - [a, cco:ont00000649]
      - [cco:ont00001916, data:team/$(teamId)~iri]
      - [cco:ont00001765, $(teamId), xsd:string]

  team_names:
    sources:
      - [current-game.json~jsonpath, "$.teams[*]"]
    s: data:team/$(teamId)/name/mlb-full
    po:
      - [a, cco:ont00001014]
      - [cco:ont00001916, data:team/$(teamId)~iri]
      - [cco:ont00001765, $(teamName), xsd:string]

  game_team_participation:
    sources:
      - [current-game.json~jsonpath, "$.teams[*]"]
    s: data:game/$(gamePk)
    po:
      - [obo:BFO_0000057, data:team/$(teamId)~iri]

  # --------------------------------------------------------------------------
  # Persons and their MLB names and identifiers
  # --------------------------------------------------------------------------

  players:
    sources:
      - [current-game.json~jsonpath, "$.players[*]"]
    s: data:player/$(playerId)
    po:
      - [a, cco:ont00001262]

  player_identifiers:
    sources:
      - [current-game.json~jsonpath, "$.players[*]"]
    s: data:player/$(playerId)/identifier/mlb-person-id
    po:
      - [a, cco:ont00000649]
      - [cco:ont00001916, data:player/$(playerId)~iri]
      - [cco:ont00001765, $(playerId), xsd:string]

  player_names:
    sources:
      - [current-game.json~jsonpath, "$.players[*]"]
    s: data:player/$(playerId)/name/mlb-full
    po:
      - [a, cco:ont00001014]
      - [cco:ont00001916, data:player/$(playerId)~iri]
      - [cco:ont00001765, $(fullName), xsd:string]

  # --------------------------------------------------------------------------
  # Career-duration roles. Repeated source occurrences generate the same IRI.
  # --------------------------------------------------------------------------

  batter_roles:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:player/$(batterId)/role/batter
    po:
      - [a, base:BatterRole]
      - [obo:BFO_0000197, data:player/$(batterId)~iri]

  pitcher_roles:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:player/$(pitcherId)/role/pitcher
    po:
      - [a, base:PitcherRole]
      - [obo:BFO_0000197, data:player/$(pitcherId)~iri]

  # --------------------------------------------------------------------------
  # Innings and half innings, including their nested temporal regions
  # --------------------------------------------------------------------------

  innings:
    sources:
      - [current-game.json~jsonpath, "$.innings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)
    po:
      - [a, base:Inning]
      - [obo:BFO_0000132, data:game/$(gamePk)~iri]
      - [obo:BFO_0000199, data:game/$(gamePk)/inning/$(inning)/temporal-region~iri]
      - [cco:ont00001918, data:venue/$(venueId)/baseball-field~iri]

  inning_temporal_regions:
    sources:
      - [current-game.json~jsonpath, "$.innings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)/temporal-region
    po:
      - [a, obo:BFO_0000202]
      - [obo:BFO_0000139, data:game/$(gamePk)/temporal-region~iri]
      - [obo:BFO_0000222, data:game/$(gamePk)/inning/$(inning)/temporal-instant/start~iri]
      - [obo:BFO_0000224, data:game/$(gamePk)/inning/$(inning)/temporal-instant/end~iri]

  inning_start_instants:
    sources:
      - [current-game.json~jsonpath, "$.innings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)/temporal-instant/start
    po:
      - [a, obo:BFO_0000203]

  inning_end_instants:
    sources:
      - [current-game.json~jsonpath, "$.innings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)/temporal-instant/end
    po:
      - [a, obo:BFO_0000203]

  inning_start_time_measurements:
    sources:
      - [current-game.json~jsonpath, "$.innings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)/time-measurement/start
    po:
      - [a, cco:ont00001163]
      - [cco:ont00001916, data:game/$(gamePk)/inning/$(inning)/temporal-instant/start~iri]
      - [cco:ont00001767, $(startTime), xsd:dateTime]

  inning_end_time_measurements:
    sources:
      - [current-game.json~jsonpath, "$.innings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)/time-measurement/end
    po:
      - [a, cco:ont00001163]
      - [cco:ont00001916, data:game/$(gamePk)/inning/$(inning)/temporal-instant/end~iri]
      - [cco:ont00001767, $(endTime), xsd:dateTime]

  half_innings:
    sources:
      - [current-game.json~jsonpath, "$.halfInnings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)/$(halfInning)
    po:
      - [a, base:HalfInning]
      - [obo:BFO_0000132, data:game/$(gamePk)/inning/$(inning)~iri]
      - [obo:BFO_0000199, data:game/$(gamePk)/inning/$(inning)/$(halfInning)/temporal-region~iri]
      - [cco:ont00001918, data:venue/$(venueId)/baseball-field~iri]

  half_inning_temporal_regions:
    sources:
      - [current-game.json~jsonpath, "$.halfInnings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)/$(halfInning)/temporal-region
    po:
      - [a, obo:BFO_0000202]
      - [obo:BFO_0000139, data:game/$(gamePk)/inning/$(inning)/temporal-region~iri]
      - [obo:BFO_0000222, data:game/$(gamePk)/inning/$(inning)/$(halfInning)/temporal-instant/start~iri]
      - [obo:BFO_0000224, data:game/$(gamePk)/inning/$(inning)/$(halfInning)/temporal-instant/end~iri]

  half_inning_start_instants:
    sources:
      - [current-game.json~jsonpath, "$.halfInnings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)/$(halfInning)/temporal-instant/start
    po:
      - [a, obo:BFO_0000203]

  half_inning_end_instants:
    sources:
      - [current-game.json~jsonpath, "$.halfInnings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)/$(halfInning)/temporal-instant/end
    po:
      - [a, obo:BFO_0000203]

  half_inning_start_time_measurements:
    sources:
      - [current-game.json~jsonpath, "$.halfInnings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)/$(halfInning)/time-measurement/start
    po:
      - [a, cco:ont00001163]
      - [cco:ont00001916, data:game/$(gamePk)/inning/$(inning)/$(halfInning)/temporal-instant/start~iri]
      - [cco:ont00001767, $(startTime), xsd:dateTime]

  half_inning_end_time_measurements:
    sources:
      - [current-game.json~jsonpath, "$.halfInnings[*]"]
    s: data:game/$(gamePk)/inning/$(inning)/$(halfInning)/time-measurement/end
    po:
      - [a, cco:ont00001163]
      - [cco:ont00001916, data:game/$(gamePk)/inning/$(inning)/$(halfInning)/temporal-instant/end~iri]
      - [cco:ont00001767, $(endTime), xsd:dateTime]

  # --------------------------------------------------------------------------
  # Plate appearances, event records, generic institutional results, and time
  # --------------------------------------------------------------------------

  plate_appearances:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)
    po:
      - [a, base:PlateAppearance]
      - [obo:BFO_0000132, data:game/$(gamePk)/inning/$(inning)/$(halfInning)~iri]
      - [obo:BFO_0000057, data:player/$(batterId)~iri]
      - [obo:BFO_0000057, data:player/$(pitcherId)~iri]
      - [obo:BFO_0000055, data:player/$(batterId)/role/batter~iri]
      - [obo:BFO_0000055, data:player/$(pitcherId)/role/pitcher~iri]
      - [obo:BFO_0000199, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/temporal-region~iri]
      - [cco:ont00001918, data:venue/$(venueId)/baseball-field~iri]

  game_batter_participants:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:game/$(gamePk)
    po:
      - [obo:BFO_0000057, data:player/$(batterId)~iri]

  game_pitcher_participants:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:game/$(gamePk)
    po:
      - [obo:BFO_0000057, data:player/$(pitcherId)~iri]

  plate_appearance_temporal_regions:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/temporal-region
    po:
      - [a, obo:BFO_0000202]
      - [obo:BFO_0000139, data:game/$(gamePk)/inning/$(inning)/$(halfInning)/temporal-region~iri]
      - [obo:BFO_0000222, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/temporal-instant/start~iri]
      - [obo:BFO_0000224, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/temporal-instant/end~iri]

  plate_appearance_start_instants:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/temporal-instant/start
    po:
      - [a, obo:BFO_0000203]

  plate_appearance_end_instants:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/temporal-instant/end
    po:
      - [a, obo:BFO_0000203]

  plate_appearance_start_time_measurements:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/time-measurement/start
    po:
      - [a, cco:ont00001163]
      - [cco:ont00001916, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/temporal-instant/start~iri]
      - [cco:ont00001767, $(startTime), xsd:dateTime]

  plate_appearance_end_time_measurements:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/time-measurement/end
    po:
      - [a, cco:ont00001163]
      - [cco:ont00001916, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/temporal-instant/end~iri]
      - [cco:ont00001767, $(endTime), xsd:dateTime]

  plate_appearance_event_records:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:game/$(gamePk)/event-record/$(atBatIndex)
    po:
      - [a, base:BaseballEventRecord]
      - [cco:ont00001765, $(description), xsd:string]
      - [cco:ont00001982, data:game/$(gamePk)/process/$(eventTypeSegment)/$(atBatIndex)~iri]

  generic_plate_appearance_result_processes:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:game/$(gamePk)/process/$(eventTypeSegment)/$(atBatIndex)
    po:
      - [a, base:BaseballInstitutionalProcess]
      - [obo:BFO_0000132, data:game/$(gamePk)/plate-appearance/$(atBatIndex)~iri]
      - [obo:BFO_0000057, data:player/$(batterId)~iri]
      - [obo:BFO_0000199, data:game/$(gamePk)/process/$(eventTypeSegment)/$(atBatIndex)/temporal-region~iri]
      - [cco:ont00001918, data:venue/$(venueId)/baseball-field~iri]

  generic_result_temporal_regions:
    sources:
      - [current-game.json~jsonpath, "$.plateAppearances[*]"]
    s: data:game/$(gamePk)/process/$(eventTypeSegment)/$(atBatIndex)/temporal-region
    po:
      - [a, obo:BFO_0000202]
      - [obo:BFO_0000139, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/temporal-region~iri]

  # --------------------------------------------------------------------------
  # Pitches and pitch event records
  # --------------------------------------------------------------------------

  pitches:
    sources:
      - [current-game.json~jsonpath, "$.pitches[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)
    po:
      - [a, base:PitchAct]
      - [obo:BFO_0000132, data:game/$(gamePk)/plate-appearance/$(atBatIndex)~iri]
      - [cco:ont00001833, data:player/$(pitcherId)~iri]
      - [obo:BFO_0000055, data:player/$(pitcherId)/role/pitcher~iri]
      - [obo:BFO_0000057, data:player/$(batterId)~iri]
      - [obo:BFO_0000199, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)/temporal-region~iri]
      - [cco:ont00001918, data:venue/$(venueId)/baseball-field~iri]

  pitch_event_records:
    sources:
      - [current-game.json~jsonpath, "$.pitches[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/event-record/$(eventIndex)
    po:
      - [a, base:BaseballEventRecord]
      - [cco:ont00001765, $(callDescription), xsd:string]
      - [cco:ont00001982, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)~iri]

  pitch_play_id_identifiers:
    sources:
      - [current-game.json~jsonpath, "$.pitches[?(@.playId != null)]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)/identifier/mlb-play-id
    po:
      - [a, cco:ont00000649]
      - [cco:ont00001916, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)~iri]
      - [cco:ont00001765, $(playId), xsd:string]

  pitch_temporal_regions:
    sources:
      - [current-game.json~jsonpath, "$.pitches[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)/temporal-region
    po:
      - [a, obo:BFO_0000202]
      - [obo:BFO_0000139, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/temporal-region~iri]
      - [obo:BFO_0000222, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)/temporal-instant/start~iri]
      - [obo:BFO_0000224, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)/temporal-instant/end~iri]

  pitch_start_instants:
    sources:
      - [current-game.json~jsonpath, "$.pitches[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)/temporal-instant/start
    po:
      - [a, obo:BFO_0000203]

  pitch_end_instants:
    sources:
      - [current-game.json~jsonpath, "$.pitches[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)/temporal-instant/end
    po:
      - [a, obo:BFO_0000203]

  pitch_start_time_measurements:
    sources:
      - [current-game.json~jsonpath, "$.pitches[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)/time-measurement/start
    po:
      - [a, cco:ont00001163]
      - [cco:ont00001916, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)/temporal-instant/start~iri]
      - [cco:ont00001767, $(startTime), xsd:dateTime]

  pitch_end_time_measurements:
    sources:
      - [current-game.json~jsonpath, "$.pitches[*]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)/time-measurement/end
    po:
      - [a, cco:ont00001163]
      - [cco:ont00001916, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)/temporal-instant/end~iri]
      - [cco:ont00001767, $(endTime), xsd:dateTime]

  # --------------------------------------------------------------------------
  # Pitch classifications and physical contact patterns
  # --------------------------------------------------------------------------

  called_strikes:
    sources:
      - [current-game.json~jsonpath, "$.pitches[?(@.callCode == 'C')]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/process/strike/$(eventIndex)
    po:
      - [a, base:StrikeProcess]
      - [obo:BFO_0000132, data:game/$(gamePk)/plate-appearance/$(atBatIndex)~iri]
      - [obo:BFO_0000062, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)~iri]
      - [obo:BFO_0000199, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/process/strike/$(eventIndex)/temporal-region~iri]
      - [cco:ont00001918, data:venue/$(venueId)/baseball-field~iri]

  swinging_strikes:
    sources:
      - [current-game.json~jsonpath, "$.pitches[?(@.callCode == 'S')]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/process/strike/$(eventIndex)
    po:
      - [a, base:StrikeProcess]
      - [obo:BFO_0000132, data:game/$(gamePk)/plate-appearance/$(atBatIndex)~iri]
      - [obo:BFO_0000062, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/swing/$(eventIndex)~iri]
      - [obo:BFO_0000199, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/process/strike/$(eventIndex)/temporal-region~iri]
      - [cco:ont00001918, data:venue/$(venueId)/baseball-field~iri]

  foul_tip_strikes:
    sources:
      - [current-game.json~jsonpath, "$.pitches[?(@.callCode == 'T')]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/process/strike/$(eventIndex)
    po:
      - [a, base:StrikeProcess]
      - [obo:BFO_0000132, data:game/$(gamePk)/plate-appearance/$(atBatIndex)~iri]
      - [obo:BFO_0000062, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/contact/$(eventIndex)~iri]
      - [obo:BFO_0000199, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/process/strike/$(eventIndex)/temporal-region~iri]
      - [cco:ont00001918, data:venue/$(venueId)/baseball-field~iri]

  balls:
    sources:
      - [current-game.json~jsonpath, "$.pitches[?(@.callCode == 'B' || @.callCode == '*B')]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/process/ball/$(eventIndex)
    po:
      - [a, base:BallProcess]
      - [obo:BFO_0000132, data:game/$(gamePk)/plate-appearance/$(atBatIndex)~iri]
      - [obo:BFO_0000062, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)~iri]
      - [obo:BFO_0000199, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/process/ball/$(eventIndex)/temporal-region~iri]
      - [cco:ont00001918, data:venue/$(venueId)/baseball-field~iri]

  explicit_swing_acts:
    sources:
      - [current-game.json~jsonpath, "$.pitches[?(@.callCode == 'S')]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/swing/$(eventIndex)
    po:
      - [a, base:SwingAct]
      - [obo:BFO_0000132, data:game/$(gamePk)/plate-appearance/$(atBatIndex)~iri]
      - [cco:ont00001833, data:player/$(batterId)~iri]
      - [obo:BFO_0000055, data:player/$(batterId)/role/batter~iri]
      - [obo:BFO_0000062, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/pitch/$(eventIndex)~iri]
      - [obo:BFO_0000199, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/swing/$(eventIndex)/temporal-region~iri]
      - [cco:ont00001918, data:venue/$(venueId)/baseball-field~iri]

  explicit_swing_temporal_regions:
    sources:
      - [current-game.json~jsonpath, "$.pitches[?(@.callCode == 'S')]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/swing/$(eventIndex)/temporal-region
    po:
      - [a, obo:BFO_0000202]
      - [obo:BFO_0000139, data:game/$(gamePk)/plate-appearance/$(atBatIndex)/temporal-region~iri]

  contact_processes:
    sources:
      - [current-game.json~jsonpath, "$.pitches[?(@.callCode == 'F' || @.callCode == 'T' || @.callCode == 'D' || @.callCode == 'E' || @.callCode == 'X')]"]
    s: data:game/$(gamePk)/plate-appearance/$(atBatIndex)/contact/$(eventIndex)
    po:
      - [a, base:BatBallContactProcess]
