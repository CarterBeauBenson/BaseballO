name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Baseball/requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r Baseball/requirements-dev.txt

      - name: Enforce prior semantic review and frozen artifacts
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.sha }}
        run: |
          set -eu
          git merge-base --is-ancestor "$BASE_REF" "$HEAD_REF"
          for commit in $(git rev-list --reverse --topo-order "$BASE_REF..$HEAD_REF")
          do
            parent=$(git rev-parse "$commit^1")
            python Baseball/scripts/validate_semantic_change_control.py --base-ref "$parent" --head-ref "$commit"
          done

      - name: Validate BaseballO
        run: python Baseball/scripts/validate_repository.py

  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Baseball/requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r Baseball/requirements-dev.txt

      - name: Validate BaseballO and Windows PowerShell paths
        run: python Baseball/scripts/validate_repository.py
